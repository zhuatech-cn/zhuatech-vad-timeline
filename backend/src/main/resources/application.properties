# 上海如静知华信息科技有限公司 · https://www.zhuatech.cn/
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:19445}
server.error.include-message=never
spring.datasource.url=${DB_URL:jdbc:h2:file:${WORKSPACE_DATA_DIR:./var}/workspace;MODE=MySQL;DATABASE_TO_LOWER=TRUE;IFEXISTS=${WORKSPACE_REQUIRE_EXISTING:FALSE}}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
app.admin-password=${ADMIN_PASSWORD:}
app.require-existing-workspace=${WORKSPACE_REQUIRE_EXISTING:false}
