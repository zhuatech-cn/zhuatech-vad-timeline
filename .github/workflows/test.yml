name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: runner.os != 'Windows'
        run: ./mvnw -B -f backend/pom.xml clean package
      - if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -f backend\pom.xml clean package
      - run: node --test scripts/import.test.mjs
      - run: python3 scripts/test-verify-evidence.py
      - run: python3 scripts/test-mysql-snapshot.py
      - run: python3 scripts/smoke.py

  compose-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged service through the published Compose port
        shell: bash
        run: |
          set -euo pipefail
          export ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export DB_PASSWORD="$(openssl rand -hex 24)"
          export DB_ROOT_PASSWORD="$(openssl rand -hex 24)"
          docker compose up -d --build
          python3 scripts/check-service.py --wait 120
          docker compose restart app
          python3 scripts/check-service.py --wait 120
